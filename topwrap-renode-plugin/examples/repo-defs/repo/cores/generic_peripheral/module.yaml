id:
  library: libdefault
  name: generic_peripheral
  vendor: vendor

clocks:
  peripheral:
    signal: clk

resets:
  peripheral:
    signal: rst_l
    polarity: active low

interfaces:
  gif_dst:
    mode: subordinate
    clock: peripheral
    reset: peripheral
    type:
      name: generic_if

signals:
  in:
  - {name: clk}
  - {name: rst_l}
  - {name: config_in}

extensions:
  renode_peripheral_gen:
    renode_device: "Peripheral.BaseDevice"
    map:
      - dest: "size"
        src: ".memory_map.size"
      - dest: "config"
        src: ".connections.config_in"


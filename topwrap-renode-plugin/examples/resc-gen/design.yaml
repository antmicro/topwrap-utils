name: example-resc-gen

clock_domains:
  default:
    signal: clk_i

reset_domains:
  default:
    signal: rst_ni
    polarity: active low

external:
  ports:
    in:
    - clk_i
    - rst_ni

interconnects:
  con0:
    type: AXI
    reset: rst_ni
    clock: clk_i
    params:
      atop: False
    memory_map: mmap0
    managers:
      core0:
        ifu_axi:
          id_width: 3

memory_maps:
  mmap0:
    peripheral0:
      axi:
        address: 0x30000000
        size: 0x1000

ips:
  core0:
    file: repo[repo]:generic_core
  peripheral0:
    file: repo[repo]:generic_peripheral

extensions:
  renode_peripheral_gen:
    supported_peripherals:
      - target:
          name: generic_core
          vendor: vendor
          library: libdefault
        renode_device: "CPU.BaseCPU"
      - target:
          name: generic_peripheral
          vendor: vendor
          library: libdefault
        renode_device: "Peripheral.BaseDevice"
    output:
      - filename: "output.repl"
        filter: ["*"]
  renode_resc:
    cpu: [core0, "output.elf"]
    analyze: [peripheral0]


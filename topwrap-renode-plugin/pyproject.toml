[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "renode_plugin"
version = "0.1.0"
description = "A plugin for generating .repl files from a topwrap design"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jinja2>=3.1.2",
  "topwrap >=0.0.1",
]

[tool.uv.sources]
topwrap = { git = "https://github.com/antmicro/topwrap.git" , rev = "5ce07de4387ca7061304dc0768be7a44cc24f8d7" }

[project.entry-points."topwrap.plugins"]
renode_plugin = "renode_plugin.main:RenodePeripheralGen"

[tool.setuptools]
packages = ["renode_plugin"]

[tool.setuptools.package-data]
renode_plugin = ["templates/*.j2"]

[project.optional-dependencies]
lint = [
  "codespell==2.3.0",
  "ruff==0.12.1"
]

[tool.ruff]
line-length = 100
extend-exclude = [
  "__pycache__",
  ".venv",
  "uv.lock"
]

[tool.ruff.lint]
select = [
  "B",
  "C9",
  "E",
  "F",
  "I",
  "W",
]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.codespell]
skip = "build,.venv,.git,__pycache__,uv.lock"
ignore-words-list = "inout, inouts"

